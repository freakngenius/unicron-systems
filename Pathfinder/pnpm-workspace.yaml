# pnpm-workspace.yaml — build-script allowlist (pnpm v10+).
# Pathfinder is a single-package project (no actual workspace), but pnpm v10
# requires explicit allowBuild entries for packages that ship install scripts.
# All three below ship platform-specific binaries that Next.js + linked tooling
# legitimately need at install time.
allowBuilds:
  esbuild: true
  protobufjs: true
  unrs-resolver: true
