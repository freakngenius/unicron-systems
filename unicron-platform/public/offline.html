<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atrium — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .container {
        max-width: 360px;
        text-align: center;
      }

      .wordmark {
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #737373;
        margin-bottom: 2.5rem;
      }

      .pulse {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid #404040;
        margin: 0 auto 2rem;
        position: relative;
      }

      .pulse::after {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 1px solid #262626;
        animation: ripple 2s ease-out infinite;
      }

      @keyframes ripple {
        0%   { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.6); }
      }

      h1 {
        font-size: 1rem;
        font-weight: 500;
        color: #e5e5e5;
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 0.875rem;
        line-height: 1.6;
        color: #737373;
      }

      .retry {
        margin-top: 2rem;
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border: 1px solid #404040;
        border-radius: 6px;
        font-size: 0.8125rem;
        color: #a3a3a3;
        cursor: pointer;
        background: transparent;
        transition: border-color 0.15s, color 0.15s;
      }

      .retry:hover {
        border-color: #737373;
        color: #e5e5e5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="wordmark">Atrium</div>
      <div class="pulse"></div>
      <h1>You're offline.</h1>
      <p>Atrium will reconnect when your network returns. Voice memos captured offline will sync automatically.</p>
      <button class="retry" onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
