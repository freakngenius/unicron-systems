        costPerReport: 0.07, simTimeStr: '00:00:00',
      });
      const [filter, setFilter] = useState(null);
      const [popup, setPopup] = useState(null);
      const [panelOpen, setPanelOpen] = useState(false);
      const [panelState, setPanelState] = useState({
        paused: false, hideHud: false, hideLegend: false, hideTrails: false, hideLabels: false,
      });
      const [legendCollapsed, setLegendCollapsed] = useState(true);
      const [logOpen, setLogOpen] = useState(false);
      const [log, setLog] = useState([]); // newest-first; capped to 200 entries

      // Rolling display values for HUD smoothing
      const displayRef = useRef({ ...hud });

      useEffect(() => {
        let cancelled = false;
        let cleanup = null;
        (async () => {
          if (typeof PIXI === 'undefined') {
            console.error('PIXI failed to load from CDN');
            return;
          }
          const app = new PIXI.Application();
          await app.init({
            backgroundAlpha: 0,
            resizeTo: window,
            antialias: true,
            resolution: Math.min(window.devicePixelRatio || 1, 2),
            autoDensity: true,
            preference: 'webgl',
          });
          if (cancelled) {
            try { app.destroy(true, { children: true, texture: true }); } catch (e) {}
            return;
          }
          if (canvasMountRef.current) canvasMountRef.current.appendChild(app.canvas);
          pixiAppRef.current = app;
          const engine = new SimEngine(app, {
            onHudUpdate: (state) => setHud(state),
            onOperationComplete: (entry) => {
              setLog(prev => {
                const next = [entry, ...prev];
                if (next.length > 200) next.length = 200;
                return next;
              });
            },
            onNodeClick: ({ node, screenX, screenY }) => {
              const examples = EXAMPLES[node.role];
              if (!examples) return;
              const idx = Math.floor(Math.random() * examples.sets.length);
              setPopup({
                role: node.role,
                layer: node.layer,
                instruction: examples.instruction,
                example: examples.sets[idx],
                x: screenX,
                y: screenY,
              });
            },
            onClick: () => setPopup(null),
          });
          engineRef.current = engine;
          cleanup = () => {
            try { engine.destroy(); } catch (e) {}
            try { app.destroy(true, { children: true, texture: true }); } catch (e) {}
          };
        })();
        return () => {
          cancelled = true;
          if (cleanup) cleanup();
        };
      }, []);

      // Animated mesh-gradient background — stripe-gradient is loaded as a sync
      // CJS script in <head> and exposed at window.StripeGradient. Init on mount.
      useEffect(() => {
        const SG = window.StripeGradient;
        const Gradient = SG && (SG.Gradient || SG.default);
        if (typeof Gradient !== 'function') {
          console.warn('stripe-gradient global missing; CSS fallback only.');
          return;
        }
        try {
          const g = new Gradient();
          g.initGradient('#gradient-canvas');
        } catch (e) {
          console.warn('stripe-gradient init failed:', e);
        }
      }, []);

      // Esc handling — separate effect so we always close against fresh state.
      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== 'Escape') return;
          if (popup) setPopup(null);
          else if (panelOpen) setPanelOpen(false);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [popup, panelOpen]);

      useEffect(() => {
        if (engineRef.current) engineRef.current.setFilter(filter);
      }, [filter]);

      const handleLegendClick = (role) => {
        if (filter === role) setFilter(null);
        else setFilter(role);
        setPopup(null);
      };

      // Format helpers
      const fmtInt = (n) => Math.floor(n).toLocaleString('en-US');
      const fmtMoney = (n) => `$${Math.floor(n).toLocaleString('en-US')}`;
      const fmtCents = (n) => `$${n.toFixed(2)}`;

      // Popup placement (auto-flip near edges)
      const popupStyle = useMemo(() => {
        if (!popup) return null;
        const w = window.innerWidth, h = window.innerHeight;
        const W = 380, H = 240;
        let left = popup.x + 16;
        let top = popup.y + 16;
        if (left + W > w - 16) left = popup.x - W - 16;
        if (top + H > h - 48) top = popup.y - H - 16;
        if (left < 16) left = 16;
        if (top < 16) top = 16;
        return { left, top };
      }, [popup]);

      const renderLegendCol = (title, roles) => (
        <div className="legend-col">
          <h4>{title}</h4>
          {roles.map(r => {
            const cfg = ROLES[r];
            const isActive = filter === r;
            const isDim = filter && filter !== r;
            return (
              <div
                key={r}
                className={`legend-row ${isActive ? 'active' : ''} ${isDim ? 'dim' : ''}`}
                onClick={() => handleLegendClick(r)}
              >
                <ShapeIcon shape={cfg.shape} color={cfg.color} />
                <span className="name">{r}</span>
              </div>
            );
          })}
        </div>
      );

      return (
        <>
          <div className="gradient-container">
            <canvas id="gradient-canvas" data-js-darken-top data-transition-in />
          </div>
          <div className="background-overlay" />
          <div ref={canvasMountRef} className="canvas-mount" />

          <div className="top-left">
            system.running · node.fabric · v1.0.0<br />
            <span className="dim">{hud.simTimeStr} utc</span>
          </div>

          <button
            className={`log-toggle ${logOpen ? 'active' : ''}`}
            onClick={() => setLogOpen(o => !o)}
            title="Operations Log"
          >LOG</button>

          <div className={`log-drawer ${logOpen ? 'open' : ''}`}>
            <div className="log-header">
              <div>
                <div className="log-title">Operations Log</div>
                <div className="log-meta">{log.length} {log.length === 1 ? 'entry' : 'entries'} · newest first</div>
              </div>
              <span className="log-close" onClick={() => setLogOpen(false)}>×</span>
            </div>
            {log.length === 0 ? (
              <div className="log-empty">No operations completed yet.</div>
            ) : (
              log.map(entry => (
                <div key={entry.id} className="log-entry">
                  <div className="log-entry-time">{entry.timeStr} utc</div>
                  <div className="log-entry-title">{entry.title}</div>
                  <div className="log-entry-flow">
                    <span style={{ color: entry.sourceRole && ROLES[entry.sourceRole] ? ROLES[entry.sourceRole].color : '#9CA3AF' }}>
                      {entry.sourceRole || '—'}
                    </span>
                    <span className="log-entry-arrow">→</span>
                    <span style={{ color: entry.finalRole && ROLES[entry.finalRole] ? ROLES[entry.finalRole].color : '#9CA3AF' }}>
                      {entry.finalRole || '—'}
                    </span>
                  </div>
                  <div className={`log-entry-status ${entry.status === 'completed' ? 'ok' : 'fail'}`}>
                    {entry.status === 'completed'
                      ? '✓ Delivered to Report'
                      : `✗ Rejected at Layer ${entry.finalLayer} · ${entry.finalRole || 'intake'}`}
                  </div>
                </div>
              ))
            )}
          </div>

          <button
            className={`tune-toggle ${panelOpen ? 'active' : ''}`}
            onClick={() => setPanelOpen(o => !o)}
          >TUNE</button>

          <div className={`legend ${panelState.hideLegend ? 'hidden' : ''} ${legendCollapsed ? 'collapsed' : ''}`}>
            <div className="legend-header">
              <span className="legend-title">Agent Key</span>
              <span
                className="legend-collapse-btn"
                onClick={() => setLegendCollapsed(c => !c)}
                title={legendCollapsed ? 'Expand' : 'Collapse'}
              >{legendCollapsed ? '+' : '−'}</span>
            </div>
            {!legendCollapsed && (
              <>
                <div
                  className={`clear-pill ${filter ? 'active' : ''}`}
                  onClick={() => setFilter(null)}
                >
                  {filter ? `clear filter — ${filter}` : 'orbital · all roles'}
                </div>
                <div className="legend-grid">
                  {renderLegendCol('Watchers', LAYER2_ROLES)}
                  {renderLegendCol('Signal', LAYER3_ROLES)}
                  {renderLegendCol('Synthesis', LAYER4_ROLES)}
                </div>
              </>
            )}
          </div>

          {popup && popupStyle && (
            <div className="popup" style={popupStyle}>
              <div className="close" onClick={() => setPopup(null)}>×</div>
              <div className="role" style={{ color: ROLES[popup.role].color }}>{popup.role}</div>
              <div className="layer">
                Layer {popup.layer} · {popup.layer === 2 ? 'Watchers' : popup.layer === 3 ? 'Signal' : 'Synthesis'}
              </div>
              <div className="field">
                <div className="field-label">Instruction</div>
                <div className="field-value">{popup.instruction}</div>
              </div>
              <div className="field">
                <div className="field-label">Input</div>
                <div className="field-code">{popup.example.input}</div>
              </div>
              <div className="field">
                <div className="field-label">Output</div>
                <div className="field-code">{popup.example.output}</div>
              </div>
              <div className="reroll-hint">click node again to re-roll example</div>
            </div>
          )}

          <div className={`hud ${panelState.hideHud ? 'hidden' : ''}`}>
            <div className="cell"><span className="label">signals.processed</span><span className="value">{fmtInt(hud.signalsProcessed)}</span></div>
            <div className="cell"><span className="label">signals.rejected</span><span className="value">{fmtInt(hud.signalsRejected)}</span></div>
            <div className="cell"><span className="label">decisions.made</span><span className="value">{fmtInt(hud.decisionsMade)}</span></div>
            <div className="cell"><span className="label">value.surfaced</span><span className="value">{fmtMoney(hud.valueSurfaced)}</span></div>
            <div className="cell"><span className="label">nodes.active</span><span className="value">{fmtInt(hud.activeNodeCount)}</span></div>
            <div className="cell"><span className="label">reports.delivered</span><span className="value">{fmtInt(hud.reportsDelivered)}</span></div>
            <div className="cell"><span className="label">cost.per.report</span><span className="value">{fmtCents(hud.costPerReport)}</span></div>
          </div>

          <ControlPanel
            open={panelOpen}
            onClose={() => setPanelOpen(false)}
            engineRef={engineRef}
            panelState={panelState}
            setPanelState={setPanelState}
          />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
